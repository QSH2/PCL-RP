name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/PclCeRegionPatch/PclCeRegionPatch.csproj

      - name: Build
        run: dotnet build src/PclCeRegionPatch/PclCeRegionPatch.csproj -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcl-ce-regionpatch
          path: |
            src/PclCeRegionPatch/bin/Release/net10.0/pcl-ce-regionpatch.dll
            src/PclCeRegionPatch/bin/Release/net10.0/Mono.Cecil.dll
